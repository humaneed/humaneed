<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUMANEED // Raum für Klarheit</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        // Warme, erdige Dunkeltöne statt kaltem Grau
                        stone: {
                            900: '#1c1917',
                            800: '#292524',
                            700: '#44403c',
                        },
                        accent: '#d97706', // Ein weicheres, wärmeres Bernstein (Amber-600)
                    }
                }
            }
        }
    </script>
    <style>
        body.lockdown { overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1c1917; }
        ::-webkit-scrollbar-thumb { background: #44403c; border-radius: 4px; }
        
        /* Weichere, taktile Regler */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%; /* Organischere Form */
            background: #d97706;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.3); /* Sanftes Glühen */
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #44403c;
            border-radius: 2px;
        }
        input[type=range]:focus { outline: none; }
    </style>
</head>
<body class="bg-stone-900 text-stone-300 font-sans antialiased selection:bg-accent selection:text-stone-900 min-h-screen flex flex-col relative selection:bg-opacity-30">

    <div id="lockdownOverlay" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-1000 px-8 text-center backdrop-blur-sm">
        <div id="timerDisplay" class="text-6xl md:text-8xl font-light text-stone-500 tracking-tight mb-12">20:00</div>
        <div id="aphorismDisplay" class="max-w-md text-stone-400 font-light text-xl leading-relaxed mb-8 italic"></div>
        <div class="text-stone-500 tracking-widest text-xs uppercase font-medium">Reizreduzierung. Atme ein.</div>
    </div>

    <main id="dashboard" class="flex-1 w-full max-w-2xl mx-auto px-6 pt-12 md:pt-16 pb-12 flex flex-col transition-opacity duration-700">
        
        <header class="mb-12 border-b border-stone-800 pb-6 flex justify-between items-end">
            <div>
                <h1 class="text-lg font-medium text-stone-200 tracking-wide mb-1">Humaneed</h1>
                <p class="text-xs text-stone-500 font-light">Raum für erlebte Selbstorganisation</p>
            </div>
            <div class="text-xs text-stone-500" id="sysTime">00:00</div>
        </header>

        <section class="flex-1 space-y-10">
            
            <div class="bg-stone-800/50 p-6 rounded-xl border border-stone-800/80">
                <div class="flex justify-between items-end mb-4">
                    <label class="text-sm font-medium text-stone-300">Fundament <span class="text-stone-500 font-light ml-1">Körper & Schlaf</span></label>
                    <span id="valBio" class="text-sm text-accent font-medium">50%</span>
                </div>
                <input type="range" id="sliderBio" min="0" max="100" value="50" class="w-full">
                <div class="flex justify-between text-[11px] text-stone-500 uppercase mt-3 font-medium">
                    <span>Erschöpft</span><span>Kraftvoll</span>
                </div>
            </div>

            <div class="bg-stone-800/50 p-6 rounded-xl border border-stone-800/80">
                <div class="flex justify-between items-end mb-4">
                    <label class="text-sm font-medium text-stone-300">Nervensystem <span class="text-stone-500 font-light ml-1">Stresstoleranz</span></label>
                    <span id="valVagal" class="text-sm text-accent font-medium">50%</span>
                </div>
                <input type="range" id="sliderVagal" min="0" max="100" value="50" class="w-full">
                <div class="flex justify-between text-[11px] text-stone-500 uppercase mt-3 font-medium">
                    <span>Überreizt</span><span>Sicher & Ruhig</span>
                </div>
            </div>

            <div class="bg-stone-800/50 p-6 rounded-xl border border-stone-800/80">
                <div class="flex justify-between items-end mb-4">
                    <label class="text-sm font-medium text-stone-300">Geist <span class="text-stone-500 font-light ml-1">Fokus & Klarheit</span></label>
                    <span id="valCog" class="text-sm text-accent font-medium">50%</span>
                </div>
                <input type="range" id="sliderCog" min="0" max="100" value="50" class="w-full">
                <div class="flex justify-between text-[11px] text-stone-500 uppercase mt-3 font-medium">
                    <span>Verloren</span><span>Klar</span>
                </div>
            </div>

            <button 
                id="btnIntervention" 
                class="mt-4 w-full bg-stone-800 hover:bg-stone-700 text-stone-200 text-sm font-medium tracking-wide py-5 rounded-xl border border-stone-700 hover:border-accent transition-all duration-300 flex justify-center items-center shadow-lg shadow-black/20">
                <span id="btnText">Zustand auswerten</span>
                <span class="text-accent opacity-0 absolute transition-opacity duration-300" id="btnIndicator">...</span>
            </button>
        </section>

        <section id="outputSection" class="mt-12 hidden opacity-0 transition-opacity duration-700">
            <div class="pt-6">
                
                <div class="mb-6 px-2">
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-xs uppercase tracking-wider text-stone-500 font-medium">Kohärenz</span>
                    </div>
                    <div class="w-full h-1.5 bg-stone-800 rounded-full overflow-hidden">
                        <div id="coherenceBar" class="h-full bg-accent w-0 transition-all duration-1000 rounded-full"></div>
                    </div>
                </div>

                <div class="bg-stone-800/30 border border-stone-800/80 p-6 rounded-xl font-mono text-sm leading-relaxed text-stone-300 shadow-inner">
                    <div id="terminalTyping"></div>
                </div>

                <button 
                    id="btnReset" 
                    class="mt-8 w-full bg-transparent text-stone-400 hover:text-stone-200 text-sm font-medium tracking-wide py-4 border border-stone-700 hover:border-stone-500 rounded-xl transition-colors duration-300">
                    Physischen Stop einleiten
                </button>
            </div>
        </section>
    </main>

    <script>
        setInterval(() => {
            const now = new Date();
            document.getElementById('sysTime').textContent = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        const aphorisms = [
            "Stärke ist die Fähigkeit, unter Druck bewusst zu bleiben.",
            "Stille beseitigt Ablenkung. In der Stille werden ungelöste Gedanken sichtbar.",
            "Wahrheit fordert Bindung heraus und fühlt sich manchmal schmerzhaft an, weil sie Illusionen auflöst.",
            "Bedeutung findet sich nicht in Ereignissen, sondern in deiner Aufmerksamkeit.",
            "Wenn du wirklich siehst, was in dir passiert, verändert sich dein Verhalten automatisch."
        ];

        const sliders = { bio: document.getElementById('sliderBio'), vagal: document.getElementById('sliderVagal'), cog: document.getElementById('sliderCog') };
        const vals = { bio: document.getElementById('valBio'), vagal: document.getElementById('valVagal'), cog: document.getElementById('valCog') };

        Object.keys(sliders).forEach(key => {
            sliders[key].addEventListener('input', (e) => { vals[key].textContent = e.target.value + '%'; });
        });

        const btnIntervention = document.getElementById('btnIntervention');
        const btnText = document.getElementById('btnText');
        const outputSection = document.getElementById('outputSection');
        const terminalTyping = document.getElementById('terminalTyping');
        const coherenceBar = document.getElementById('coherenceBar');
        let isTyping = false;

        function calculateSystem() {
            const b = parseInt(sliders.bio.value);
            const v = parseInt(sliders.vagal.value);
            const c = parseInt(sliders.cog.value);

            let coherence = Math.round((b * 0.5) + (v * 0.3) + (c * 0.2));
            let diag = {};

            if (b < 30 || coherence < 40) {
                diag = {
                    kohärenz: coherence,
                    diagnose: "Dein Fundament ist erschöpft. Der Autopilot hat übernommen. Versuche jetzt keine komplexen Probleme zu lösen.",
                    titel: "Der physiologische Reset",
                    aktion: "Lass eiskaltes Wasser über deine Handgelenke laufen. Atme zweimal tief aus. Nimm dir 20 Minuten völlige Ruhe, ohne einen Bildschirm."
                };
            } else if (c < 40) {
                diag = {
                    kohärenz: coherence,
                    diagnose: "Dein Geist ist überstimuliert. Die kognitive Kapazität ist am Limit, der Lärm ist zu laut.",
                    titel: "Kognitive Integrität",
                    aktion: "Schließe alle Tabs bis auf einen. Richte deinen Blick für 2 Minuten entspannt auf einen weit entfernten Punkt. Finde deinen Fokus wieder."
                };
            } else if (v < 40) {
                diag = {
                    kohärenz: coherence,
                    diagnose: "Dein Nervensystem ist in ständiger Alarmbereitschaft. Die nötige Vorbereitung für tiefen Schlaf ist blockiert.",
                    titel: "Low-Light-Abend",
                    aktion: "Schalte die Deckenlampen aus. Nutze nur noch warme, schwache Lichtquellen. Gib deinem Körper das Signal, dass er sicher ist."
                };
            } else {
                diag = {
                    kohärenz: coherence,
                    diagnose: "Deine Struktur trägt. Du bist zentriert und handlungsfähig.",
                    titel: "Der klare Cut",
                    aktion: "Räume deinen Schreibtisch physisch auf. Behalte diese Ordnung bei. Das physische Ritual schützt deinen mentalen Raum."
                };
            }
            return diag;
        }

        async function typeTerminal(diag) {
            isTyping = true;
            coherenceBar.style.width = '0%';
            terminalTyping.innerHTML = '<span class="text-stone-500 animate-pulse">...</span>';
            
            await new Promise(r => setTimeout(r, 600));
            coherenceBar.style.width = diag.kohärenz + '%';
            
            const lines = [
                `<div class="mb-4 text-stone-300">${diag.diagnose}</div>`,
                `<div class="mt-6 mb-1 text-accent uppercase tracking-wider text-xs font-sans font-medium">Empfehlung: ${diag.titel}</div>`,
                `<div class="text-stone-400 leading-relaxed">${diag.aktion}</div>`
            ];

            terminalTyping.innerHTML = lines.join('');
            isTyping = false;
        }

        btnIntervention.addEventListener('click', async () => {
            if (isTyping) return;
            const diagnosis = calculateSystem();
            
            btnText.style.opacity = '0';
            document.getElementById('btnIndicator').classList.remove('opacity-0');
            
            outputSection.classList.remove('hidden');
            setTimeout(() => outputSection.classList.remove('opacity-0'), 50);

            await typeTerminal(diagnosis);
            
            document.getElementById('btnIndicator').classList.add('opacity-0');
            btnText.style.opacity = '1';
        });

        const btnReset = document.getElementById('btnReset');
        const overlay = document.getElementById('lockdownOverlay');
        const timerDisp = document.getElementById('timerDisplay');
        const aphorismDisp = document.getElementById('aphorismDisplay');
        const dashboard = document.getElementById('dashboard');
        let timerInt;

        btnReset.addEventListener('click', () => {
            const randomAphorism = aphorisms[Math.floor(Math.random() * aphorisms.length)];
            aphorismDisp.textContent = randomAphorism;

            document.body.classList.add('lockdown');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                dashboard.classList.add('opacity-0', 'pointer-events-none');
            }, 50);

            let timeLeft = 20 * 60;
            updateTimer(timeLeft);

            timerInt = setInterval(() => {
                timeLeft--;
                updateTimer(timeLeft);
                if (timeLeft <= 0) endLockdown();
            }, 1000);
        });

        function updateTimer(s) {
            const m = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            timerDisp.textContent = `${m}:${sec}`;
        }

        function endLockdown() {
            clearInterval(timerInt);
            document.body.classList.remove('lockdown');
            overlay.classList.add('opacity-0');
            dashboard.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                overlay.classList.add('hidden');
                outputSection.classList.add('hidden', 'opacity-0');
            }, 1000);
        }
    </script>
</body>
</html>
