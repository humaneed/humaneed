<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUMANEED // Diagnostik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-dots:after { content: '.'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 100% { content: ''; } }
        body.lockdown { overflow: hidden; }
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #d97706; cursor: pointer; box-shadow: 0 0 10px rgba(217, 119, 6, 0.3); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #44403c; border-radius: 2px; }
    </style>
</head>
<body class="bg-stone-900 text-stone-300 font-sans min-h-screen">

    <div id="lockdownOverlay" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-1000 px-8 text-center backdrop-blur-sm">
        <div id="timerDisplay" class="text-7xl font-light text-stone-500 mb-12">20:00</div>
        <div id="aphorismDisplay" class="max-w-md text-stone-400 text-xl italic mb-8"></div>
    </div>

    <main id="dashboard" class="max-w-2xl mx-auto px-6 py-12 transition-opacity duration-700">
        <header class="mb-12 border-b border-stone-800 pb-6">
            <h1 class="text-lg font-medium text-stone-200">Humaneed</h1>
            <p class="text-xs text-stone-500">Raum für erlebte Selbstorganisation</p>
        </header>

        <section class="space-y-8">
            <div><label class="block text-sm mb-2">Körper & Schlaf</label><input type="range" id="sliderBio" value="50"></div>
            <div><label class="block text-sm mb-2">Stresstoleranz</label><input type="range" id="sliderVagal" value="50"></div>
            <div><label class="block text-sm mb-2">Fokus & Klarheit</label><input type="range" id="sliderCog" value="50"></div>
            <textarea id="journalInput" rows="3" class="w-full bg-stone-800/50 p-4 rounded-lg border border-stone-700 outline-none focus:border-accent text-sm" placeholder="Gedanken festhalten..."></textarea>
            <button id="btnIntervention" class="w-full bg-stone-800 py-4 rounded-xl border border-stone-700 hover:border-accent transition-all">Zustand auswerten</button>
        </section>

        <section id="outputSection" class="mt-12 hidden opacity-0 transition-opacity duration-700">
            <div class="w-full h-1.5 bg-stone-800 rounded-full mb-6 overflow-hidden">
                <div id="coherenceBar" class="h-full bg-accent w-0 transition-all duration-1000"></div>
            </div>
            <div id="terminalTyping" class="bg-stone-800/30 p-6 rounded-xl border border-stone-800 font-mono text-sm text-stone-400"></div>
            <button id="btnReset" class="mt-8 w-full py-4 border border-stone-700 rounded-xl hover:text-white">Physischen Stop einleiten</button>
        </section>
    </main>

    <script>
        const btn = document.getElementById('btnIntervention');
        
        btn.addEventListener('click', async () => {
            const output = document.getElementById('outputSection');
            const terminal = document.getElementById('terminalTyping');
            
            // UI State
            btn.disabled = true;
            btn.textContent = "Analysiere...";
            output.classList.remove('hidden');
            setTimeout(() => output.classList.remove('opacity-0'), 50);
            
            try {
                const res = await fetch('/api/diagnose', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bio: parseInt(document.getElementById('sliderBio').value),
                        vagal: parseInt(document.getElementById('sliderVagal').value),
                        cog: parseInt(document.getElementById('sliderCog').value),
                        text: document.getElementById('journalInput').value
                    })
                });
                
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                document.getElementById('coherenceBar').style.width = data.kohärenz + '%';
                terminal.innerHTML = `<div class="text-stone-200 mb-4">${data.diagnose}</div>
                                      <div class="text-accent font-bold uppercase tracking-widest">${data.titel}</div>
                                      <div class="mt-2">${data.aktion}</div>`;
            } catch (e) {
                terminal.innerHTML = "System ist offline. Bitte Verbindung zum Backend prüfen.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Zustand auswerten";
            }
        });

        // Lockdown Logik bleibt stabil
        document.getElementById('btnReset').addEventListener('click', () => {
            const aphorisms = ["Stärke ist die Fähigkeit, unter Druck bewusst zu bleiben.", "Stille beseitigt Ablenkung.", "Bedeutung findet sich in der Aufmerksamkeit."];
            document.getElementById('aphorismDisplay').textContent = aphorisms[Math.floor(Math.random() * aphorisms.length)];
            document.body.classList.add('lockdown');
            document.getElementById('lockdownOverlay').classList.remove('hidden');
            setTimeout(() => document.getElementById('lockdownOverlay').classList.remove('opacity-0'), 50);
            
            let timeLeft = 1200;
            const timer = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft/60).toString().padStart(2,'0');
                const s = (timeLeft%60).toString().padStart(2,'0');
                document.getElementById('timerDisplay').textContent = `${m}:${s}`;
                if(timeLeft <= 0) { clearInterval(timer); location.reload(); }
            }, 1000);
        });
    </script>
</body>
</html>
