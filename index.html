<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>HUMANEED // Klarheit</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { stone: { 900: '#1c1917', 800: '#292524', 700: '#44403c' }, accent: '#d97706' }
                }
            }
        }
    </script>
    <style>
        body.lockdown { overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1c1917; }
        ::-webkit-scrollbar-thumb { background: #44403c; border-radius: 4px; }
        
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: #d97706; cursor: pointer; margin-top: -8px;
            box-shadow: 0 0 12px rgba(217, 119, 6, 0.4); transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.15); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #44403c; border-radius: 2px; }
        input[type=range]:focus { outline: none; }
    </style>
</head>
<body class="bg-stone-900 text-stone-300 font-sans min-h-screen flex flex-col selection:bg-accent selection:bg-opacity-30">

    <div id="lockdownOverlay" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-1000 px-8 text-center backdrop-blur-md">
        <div id="timerDisplay" class="text-7xl font-light text-stone-500 tracking-tight mb-12">20:00</div>
        <div id="aphorismDisplay" class="max-w-md text-stone-400 font-light text-xl leading-relaxed mb-8 italic"></div>
        <div class="text-stone-500 tracking-widest text-[10px] uppercase font-medium">Reizreduzierung aktiv. Atme.</div>
    </div>

    <main id="dashboard" class="flex-1 w-full max-w-2xl mx-auto px-6 pt-12 pb-16 flex flex-col transition-opacity duration-700">
        
        <header class="mb-12 border-b border-stone-800 pb-6 flex justify-between items-end">
            <div>
                <h1 class="text-lg font-medium text-stone-200 tracking-wide mb-1">Humaneed</h1>
                <p class="text-xs text-stone-500 font-light">Dein Kompass für Klarheit</p>
            </div>
            <div class="text-xs text-stone-500 font-mono" id="sysTime">00:00</div>
        </header>

        <section class="space-y-8">
            <div class="bg-stone-800/40 p-6 rounded-xl border border-stone-800/80">
                <div class="flex justify-between mb-4"><label class="text-sm font-medium">Körper & Energie <span class="text-stone-500 font-light ml-1">(Schlaf, Akku)</span></label><span id="valBio" class="text-accent text-sm font-mono">50%</span></div>
                <input type="range" id="sliderBio" min="0" max="100" value="50">
                <div class="flex justify-between text-[10px] text-stone-500 uppercase mt-3"><span>Erschöpft</span><span>Kraftvoll</span></div>
            </div>

            <div class="bg-stone-800/40 p-6 rounded-xl border border-stone-800/80">
                <div class="flex justify-between mb-4"><label class="text-sm font-medium">Nervensystem <span class="text-stone-500 font-light ml-1">(Stresslevel)</span></label><span id="valVagal" class="text-accent text-sm font-mono">50%</span></div>
                <input type="range" id="sliderVagal" min="0" max="100" value="50">
                <div class="flex justify-between text-[10px] text-stone-500 uppercase mt-3"><span>Gestreßt / Unruhig</span><span>Sicher / Entspannt</span></div>
            </div>

            <div class="bg-stone-800/40 p-6 rounded-xl border border-stone-800/80">
                <div class="flex justify-between mb-4"><label class="text-sm font-medium">Geistiger Fokus <span class="text-stone-500 font-light ml-1">(Klarheit)</span></label><span id="valCog" class="text-accent text-sm font-mono">50%</span></div>
                <input type="range" id="sliderCog" min="0" max="100" value="50">
                <div class="flex justify-between text-[10px] text-stone-500 uppercase mt-3"><span>Zerstreut / Überladen</span><span>Klarer Fokus</span></div>
            </div>

            <div class="mt-4">
                <textarea id="journalInput" rows="3" class="w-full bg-stone-800/30 text-stone-300 border border-stone-800 rounded-xl p-5 font-light text-sm resize-none focus:border-accent/50 focus:bg-stone-900 focus:outline-none transition-all placeholder-stone-600" placeholder="Was beschäftigt dich gerade? (Lass die Gedanken kurz los...)"></textarea>
            </div>

            <button id="btnIntervention" class="w-full bg-stone-800 hover:bg-stone-700 text-stone-200 text-sm font-medium tracking-wide py-5 rounded-xl border border-stone-700 hover:border-accent transition-all duration-300 shadow-lg shadow-black/20">
                Was brauche ich jetzt?
            </button>
        </section>

        <section id="outputSection" class="mt-12 hidden opacity-0 transition-opacity duration-700">
            <div class="bg-stone-800/30 border border-stone-800/80 p-6 rounded-xl text-sm leading-relaxed text-stone-300 shadow-inner">
                <div id="terminalTyping"></div>
            </div>

            <button id="btnReset" class="mt-8 w-full bg-transparent text-stone-400 hover:text-stone-200 text-sm font-medium py-4 border border-stone-800 hover:border-stone-600 rounded-xl transition-all">
                Pause starten (20 Min)
            </button>
        </section>
    </main>

    <script>
        // System Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('sysTime').textContent = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // Aphorismen für jedermann verständlich
        const aphorisms = [
            "Stärke bedeutet, auch unter Druck kurz innezuhalten.",
            "Stille beseitigt Ablenkung. In der Ruhe siehst du wieder klar.",
            "Dein Leben bekommt Bedeutung durch das, worauf du deine Aufmerksamkeit richtest.",
            "Sobald du ehrlich hinschaust, verändert sich etwas von ganz allein.",
            "Du bist nicht der Maschinenraum, aber du entscheidest, ob du mitgehst."
        ];

        // Die übersetzte 15-Setups-Matrix (Für jedermann)
        const knowledgeBase = [
            { id: "01", keywords: ["arbeit", "feierabend", "nach hause", "abschalten"], diagnose: "Dein Kopf ist noch im Arbeitsmodus. Der Übergang fehlt.", titel: "Der Schwellen-Puffer", aktion: "Nimm dir 5 Minuten vor der Tür. Atme tief aus. Schließe gedanklich ab, bevor du den nächsten Raum betrittst." },
            { id: "02", keywords: ["morgen", "aufstehen", "start", "früh"], diagnose: "Lass dich morgens nicht sofort fremdsteuern.", titel: "Die ersten 30 Minuten", aktion: "Kein Bildschirm in der ersten halben Stunde des Tages. Gehöre erst dir selbst, bevor du der Welt antwortest." },
            { id: "03", keywords: ["viel zu tun", "kopf voll", "vergessen", "chaos", "to-do"], diagnose: "Dein Arbeitsspeicher ist überlastet. Das Gehirn versucht krampfhaft, nichts zu vergessen.", titel: "Der Gedanken-Parkplatz", aktion: "Nimm dir sofort einen Stift. Schreib alles auf, was offen ist. Hol es aus dem Kopf aufs Papier." },
            { id: "04", keywords: ["tabs", "zerstreut", "multitasking", "konzentration"], diagnose: "Reizüberflutung. Zu viele offene Fenster zersplittern deine Energie.", titel: "Die 1-Tab-Regel", aktion: "Schließe alle Programme bis auf eines. Arbeite 45 Minuten nur an dieser einen Sache." },
            { id: "06", keywords: ["entscheidung", "müde", "erschöpft", "routine"], diagnose: "Entscheidungsmüdigkeit. Du verschwendest Kraft für kleine, unwichtige Dinge.", titel: "Weniger ist mehr", aktion: "Triff kleine Entscheidungen für morgen schon heute (z.B. Kleidung rauslegen). Schone deinen Fokus." },
            { id: "07", keywords: ["panik", "überfordert", "akut", "stress", "angst", "kaputt", "genervt"], diagnose: "Dein Körper ist im Alarmzustand (Kampf/Flucht). Logisches Denken ist gerade blockiert.", titel: "Die Notbremse", aktion: "Lass eiskaltes Wasser über deine Handgelenke laufen. Das signalisiert dem Körper sofort: Gefahr vorüber." },
            { id: "08", keywords: ["handy", "scrollen", "social media", "instagram", "tiktok", "ablenkung"], diagnose: "Der Autopilot hat übernommen. Du suchst schnelle Bestätigung im Außen.", titel: "Der Graustufen-Modus", aktion: "Stelle dein Handy sofort auf Schwarz-Weiß. Zerstöre den bunten Reiz und leg es außer Sichtweite." },
            { id: "09", keywords: ["schlaf", "abend", "licht", "dunkel", "nacht", "schlecht geschlafen"], diagnose: "Deine innere Uhr ist durcheinander. Dein Körper weiß nicht, dass es Zeit für Ruhe ist.", titel: "Low-Light-Abend", aktion: "Schalte alle hellen Deckenlampen aus. Nutze nur noch sanftes Licht. Bereite dich auf echte Erholung vor." },
            { id: "11", keywords: ["augen", "bildschirm", "drinnen", "stundenlang", "kopfschmerzen"], diagnose: "Dein Blickfeld ist zu eng. Das signalisiert dem Gehirn unbewusst Stress.", titel: "Der weite Blick", aktion: "Geh ans Fenster. Schau für 2 Minuten entspannt auf den am weitesten entfernten Punkt draußen." },
            { id: "12", keywords: ["verloren", "gedankenkarussell", "grübeln"], diagnose: "Du bist in deinen Gedanken gefangen und verlierst den Kontakt zur Realität.", titel: "Der physische Anker", aktion: "Setz dich aufrecht hin. Spüre ganz bewusst deine Füße auf dem Boden. Atme dreimal tief in den Bauch." },
            { id: "13", keywords: ["druck", "antworten", "email", "nachricht", "schnell", "chef"], diagnose: "Der Druck von außen zwingt dich zu schnellen Reaktionen.", titel: "Die 24-Stunden-Regel", aktion: "Lass dich nicht hetzen. Antworte nur: 'Ich prüfe das und melde mich morgen.' Gewinne deine Kontrolle zurück." },
            { id: "15", keywords: ["fertig", "ende", "laptop", "schluss"], diagnose: "Die Arbeit sickert in deine Freizeit. Es fehlt ein klarer Schnitt.", titel: "Der klare Cut", aktion: "Klappe den Laptop physisch zu. Räume den Tisch komplett auf. Lass die Arbeit am Schreibtisch zurück." }
        ];

        // UI Sliders
        const sliders = { bio: document.getElementById('sliderBio'), vagal: document.getElementById('sliderVagal'), cog: document.getElementById('sliderCog') };
        const vals = { bio: document.getElementById('valBio'), vagal: document.getElementById('valVagal'), cog: document.getElementById('valCog') };
        Object.keys(sliders).forEach(key => {
            sliders[key].addEventListener('input', (e) => { vals[key].textContent = e.target.value + '%'; });
        });

        // App Logik
        document.getElementById('btnIntervention').addEventListener('click', async () => {
            const btn = document.getElementById('btnIntervention');
            const out = document.getElementById('outputSection');
            const terminal = document.getElementById('terminalTyping');
            
            const b = parseInt(sliders.bio.value);
            const v = parseInt(sliders.vagal.value);
            const c = parseInt(sliders.cog.value);
            const text = document.getElementById('journalInput').value.toLowerCase();

            btn.textContent = "Gedanken werden sortiert...";
            btn.style.pointerEvents = 'none';

            // 1. Suche nach Keywords im Text
            let match = knowledgeBase.find(item => item.keywords.some(kw => text.includes(kw)));

            // 2. Fallback: Logische Diagnose anhand der Regler
            if (!match) {
                if (b < 40 && b <= v && b <= c) {
                    match = knowledgeBase.find(item => item.id === "07"); // Bio schwach
                } else if (v < 40 && v <= b && v <= c) {
                    match = knowledgeBase.find(item => item.id === "12"); // Stress hoch -> Anker
                } else if (c < 40 && c <= b && c <= v) {
                    match = knowledgeBase.find(item => item.id === "04"); // Fokus weg -> 1-Tab
                } else {
                    match = knowledgeBase.find(item => item.id === "15"); // Alles okay -> Klarer Cut
                }
            }

            // UI Update
            out.classList.remove('hidden');
            setTimeout(() => out.classList.remove('opacity-0'), 50);
            
            terminal.innerHTML = `<span class="text-stone-500 animate-pulse">Lade Empfehlung...</span>`;

            setTimeout(() => {
                terminal.innerHTML = `
                    <div class="mb-4 text-stone-200 font-medium text-base">${match.diagnose}</div>
                    <div class="mb-1 text-accent uppercase tracking-widest text-xs font-bold">${match.titel}</div>
                    <div class="text-stone-400 font-light">${match.aktion}</div>
                `;
                btn.textContent = "Was brauche ich jetzt?";
                btn.style.pointerEvents = 'auto';
            }, 600);
        });

        // Timer Logik
        let timerInt;
        document.getElementById('btnReset').addEventListener('click', () => {
            document.getElementById('aphorismDisplay').textContent = aphorisms[Math.floor(Math.random() * aphorisms.length)];
            document.body.classList.add('lockdown');
            document.getElementById('lockdownOverlay').classList.remove('hidden');
            setTimeout(() => document.getElementById('lockdownOverlay').classList.remove('opacity-0'), 50);
            
            let timeLeft = 20 * 60;
            const timerDisp = document.getElementById('timerDisplay');
            timerDisp.textContent = "20:00";

            timerInt = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                timerDisp.textContent = `${m}:${s}`;
                if (timeLeft <= 0) { 
                    clearInterval(timerInt); 
                    location.reload(); 
                }
            }, 1000);
        });
    </script>
</body>
</html>
