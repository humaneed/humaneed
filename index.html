<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUMANEED // Systemarchitektur</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        charcoal: {
                            900: '#0a0a0c',
                            800: '#121215',
                            700: '#1e1e24',
                            600: '#2a2a32',
                        },
                        accent: '#f59e0b', // Amber
                    }
                }
            }
        }
    </script>
    <style>
        body.lockdown { overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #1e1e24; }
        
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 12px;
            border-radius: 0;
            background: #f59e0b;
            cursor: pointer;
            margin-top: -10px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #1e1e24;
        }
        input[type=range]:focus { outline: none; }
    </style>
</head>
<body class="bg-charcoal-900 text-zinc-300 font-sans antialiased selection:bg-accent selection:text-charcoal-900 min-h-screen flex flex-col relative">

    <div id="lockdownOverlay" class="fixed inset-0 bg-black z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-1000 px-8 text-center">
        <div id="timerDisplay" class="text-6xl md:text-8xl font-mono text-zinc-500 tracking-tighter mb-12">20:00</div>
        <div id="aphorismDisplay" class="max-w-md text-zinc-400 font-light text-lg leading-relaxed mb-6"></div>
        <div class="text-zinc-600 tracking-widest text-xs uppercase font-mono">Reizreduzierung aktiv. Keine Entscheidungen.</div>
    </div>

    <main id="dashboard" class="flex-1 w-full max-w-2xl mx-auto px-6 pt-12 md:pt-16 pb-12 flex flex-col transition-opacity duration-700">
        
        <header class="mb-10 border-b border-charcoal-700 pb-4 flex justify-between items-end">
            <h1 class="text-xs tracking-[0.3em] text-zinc-500 uppercase">Humaneed // Architektur</h1>
            <div class="text-xs font-mono text-zinc-600" id="sysTime">00:00</div>
        </header>

        <section class="flex-1 space-y-8">
            
            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="text-xs uppercase tracking-wider text-zinc-400">T-0: Biologische Basis (Schlaf / Hydration)</label>
                    <span id="valBio" class="text-xs font-mono text-accent">50%</span>
                </div>
                <input type="range" id="sliderBio" min="0" max="100" value="50" class="w-full">
                <div class="flex justify-between text-[10px] text-zinc-600 uppercase mt-1">
                    <span>Erschöpft</span><span>Stabil</span>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="text-xs uppercase tracking-wider text-zinc-400">T-1: Vagal-Zustand (Kampf/Flucht vs. Sicherheit)</label>
                    <span id="valVagal" class="text-xs font-mono text-accent">50%</span>
                </div>
                <input type="range" id="sliderVagal" min="0" max="100" value="50" class="w-full">
                <div class="flex justify-between text-[10px] text-zinc-600 uppercase mt-1">
                    <span>Überreizt</span><span>Kohärent</span>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="text-xs uppercase tracking-wider text-zinc-400">T-3: Kognition (Aufmerksamkeit / DMN)</label>
                    <span id="valCog" class="text-xs font-mono text-accent">50%</span>
                </div>
                <input type="range" id="sliderCog" min="0" max="100" value="50" class="w-full">
                <div class="flex justify-between text-[10px] text-zinc-600 uppercase mt-1">
                    <span>Fragmentiert</span><span>Fokussiert</span>
                </div>
            </div>

            <button 
                id="btnIntervention" 
                class="mt-8 w-full bg-charcoal-800 hover:bg-charcoal-700 text-zinc-300 text-xs tracking-[0.2em] uppercase py-5 border border-charcoal-700 hover:border-accent transition-all duration-300 flex justify-between items-center px-6">
                <span>[ Struktur Evaluieren ]</span>
                <span class="text-accent opacity-0 transition-opacity duration-300" id="btnIndicator">///</span>
            </button>
        </section>

        <section id="outputSection" class="mt-12 hidden opacity-0 transition-opacity duration-700">
            <div class="border-t border-charcoal-700 pt-8">
                
                <div class="mb-4">
                    <span class="text-xs uppercase tracking-wider text-zinc-500">Systemkohärenz</span>
                    <div class="w-full h-1 bg-charcoal-800 mt-2">
                        <div id="coherenceBar" class="h-full bg-accent w-0 transition-all duration-1000"></div>
                    </div>
                </div>

                <div class="bg-[#050505] border border-charcoal-700 p-6 font-mono text-sm leading-relaxed mt-4">
                    <div id="terminalTyping" class="text-zinc-400"></div>
                </div>

                <button 
                    id="btnReset" 
                    class="mt-8 w-full bg-transparent text-zinc-500 hover:text-zinc-300 text-xs tracking-[0.2em] uppercase py-4 border border-charcoal-800 hover:border-charcoal-600 transition-colors duration-300">
                    [ Analogen Reset Erzwingen ]
                </button>
            </div>
        </section>
    </main>

    <script>
        // System Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('sysTime').textContent = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // Aphorismen aus Teil I für den Lockdown-Screen
        const aphorisms = [
            "Stärke ist die Fähigkeit, unter Druck bewusst zu bleiben. Gewalt ist leicht. Bewusstheit ist selten.",
            "Stille beseitigt Ablenkung. In der Stille werden ungelöste Gedanken sichtbar. Und sobald etwas klar gesehen wird, wird Ehrlichkeit notwendig.",
            "Wahrheit fordert Bindung heraus und fühlt sich schmerzhaft an, weil sie Illusionen auflöst.",
            "Bedeutung findet sich nicht in Ereignissen, sondern in Aufmerksamkeit.",
            "Wenn du wirklich siehst, was in dir passiert, verändert sich dein Verhalten automatisch."
        ];

        // Sliders
        const sliders = { bio: document.getElementById('sliderBio'), vagal: document.getElementById('sliderVagal'), cog: document.getElementById('sliderCog') };
        const vals = { bio: document.getElementById('valBio'), vagal: document.getElementById('valVagal'), cog: document.getElementById('valCog') };

        Object.keys(sliders).forEach(key => {
            sliders[key].addEventListener('input', (e) => { vals[key].textContent = e.target.value + '%'; });
        });

        const btnIntervention = document.getElementById('btnIntervention');
        const outputSection = document.getElementById('outputSection');
        const terminalTyping = document.getElementById('terminalTyping');
        const coherenceBar = document.getElementById('coherenceBar');
        let isTyping = false;

        // Logic Engine basierend auf den 15 Mini-Setups
        function calculateSystem() {
            const b = parseInt(sliders.bio.value);
            const v = parseInt(sliders.vagal.value);
            const c = parseInt(sliders.cog.value); // Hier bedeutet niedrig=fragmentiert, hoch=fokussiert

            // Systemkohärenz-Formel
            let coherence = Math.round((b * 0.5) + (v * 0.3) + (c * 0.2));
            let diag = {};

            if (b < 30 || coherence < 40) {
                diag = {
                    kohärenz: coherence,
                    status: "KRITISCH - POLYVAGALE ÜBERLASTUNG",
                    diagnose: "Biologische Basis defizitär. Autopilot aktiv. Cortisol-Achse überreizt.",
                    direktive: "SETUP 07 & 08",
                    titel: "Der physiologische Reset",
                    aktion: "Smartphone auf Graustufen umstellen. Entfernt den primären Dopamin-Trigger. Eiskaltes Wasser über die Handgelenke, zweimal langsam ausatmen. Direkter Eingriff ins autonome Nervensystem."
                };
            } else if (c < 40) {
                diag = {
                    kohärenz: coherence,
                    status: "FRAGMENTIERT - DMN ÜBERSTIMULIERT",
                    diagnose: "Default Mode Network überstimuliert. Kognitive Kapazität erschöpft. Dauerlärm.",
                    direktive: "SETUP 04 & 11",
                    titel: "Kognitive Integrität",
                    aktion: "1-Tab-Regel anwenden: Ein Fenster für die aktuelle Aufgabe. Der weite Blick: Alle 60 Minuten 2 Minuten auf einen weit entfernten Punkt schauen, um Amygdala-Aktivierung zu senken."
                };
            } else if (v < 40) {
                diag = {
                    kohärenz: coherence,
                    status: "ASYMMETRISCH - SYMPATHIKUS DOMINIERT",
                    diagnose: "Chronische Überaktivierung detektiert. Vorbereitung für glymphatisches System (Schlaf) blockiert.",
                    direktive: "SETUP 09",
                    titel: "Low-Light-Abend",
                    aktion: "90 Minuten vor dem Schlafen alle Deckenlampen aus, nur warme Lichtquellen. Melatonin-Synthese ermöglichen — circadiane Genexpression nicht stören."
                };
            } else {
                diag = {
                    kohärenz: coherence,
                    status: "STABIL - STRUKTUR TRÄGT",
                    diagnose: "Systemparameter im Toleranzbereich. Erlebte Selbstorganisation stabil.",
                    direktive: "SETUP 15",
                    titel: "Der klare Cut",
                    aktion: "Laptop zuklappen, Schreibtisch leerräumen. Das physische Ritual übernimmt die Funktion des fehlenden Arbeitsweges. Struktur halten."
                };
            }
            return diag;
        }

        async function typeTerminal(diag) {
            isTyping = true;
            coherenceBar.style.width = '0%';
            terminalTyping.innerHTML = '<span class="text-zinc-600 animate-pulse">_</span>';
            
            await new Promise(r => setTimeout(r, 400));
            coherenceBar.style.width = diag.kohärenz + '%';
            
            const lines = [
                `<span class="text-zinc-600">> KOHÄRENZ: ${diag.kohärenz}% [${diag.status}]</span><br><br>`,
                `<span class="text-zinc-300">DIAGNOSE:</span> <span class="text-zinc-400">${diag.diagnose}</span><br><br>`,
                `<span class="text-accent">DIREKTIVE [${diag.direktive}]:</span> <span class="text-zinc-200">${diag.titel}</span><br>`,
                `<span class="text-zinc-400">${diag.aktion}</span>`
            ];

            terminalTyping.innerHTML = lines.join('');
            isTyping = false;
        }

        btnIntervention.addEventListener('click', async () => {
            if (isTyping) return;
            const diagnosis = calculateSystem();
            
            document.getElementById('btnIndicator').classList.remove('opacity-0');
            btnIntervention.classList.add('border-accent');
            
            outputSection.classList.remove('hidden');
            setTimeout(() => outputSection.classList.remove('opacity-0'), 50);

            await typeTerminal(diagnosis);
            
            document.getElementById('btnIndicator').classList.add('opacity-0');
            btnIntervention.classList.remove('border-accent');
        });

        // Lockdown Logic
        const btnReset = document.getElementById('btnReset');
        const overlay = document.getElementById('lockdownOverlay');
        const timerDisp = document.getElementById('timerDisplay');
        const aphorismDisp = document.getElementById('aphorismDisplay');
        const dashboard = document.getElementById('dashboard');
        let timerInt;

        btnReset.addEventListener('click', () => {
            // Zufälligen Aphorismus auswählen
            const randomAphorism = aphorisms[Math.floor(Math.random() * aphorisms.length)];
            aphorismDisp.textContent = randomAphorism;

            document.body.classList.add('lockdown');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                dashboard.classList.add('opacity-0', 'pointer-events-none');
            }, 50);

            let timeLeft = 20 * 60;
            updateTimer(timeLeft);

            timerInt = setInterval(() => {
                timeLeft--;
                updateTimer(timeLeft);
                if (timeLeft <= 0) endLockdown();
            }, 1000);
        });

        function updateTimer(s) {
            const m = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            timerDisp.textContent = `${m}:${sec}`;
        }

        function endLockdown() {
            clearInterval(timerInt);
            document.body.classList.remove('lockdown');
            overlay.classList.add('opacity-0');
            dashboard.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                overlay.classList.add('hidden');
                outputSection.classList.add('hidden', 'opacity-0');
                sliders.bio.value = 50; vals.bio.textContent = "50%";
                sliders.vagal.value = 50; vals.vagal.textContent = "50%";
                sliders.cog.value = 50; vals.cog.textContent = "50%";
            }, 1000);
        }
    </script>
</body>
</html>
