<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUMANEED // Struktur-Navigator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        // Exakte "Matte Charcoal" und "Amber" Akzent-Farben
                        charcoal: {
                            900: '#0a0a0c',
                            800: '#121215',
                            700: '#1e1e24',
                        },
                        accent: '#f59e0b', // Amber-500
                    }
                }
            }
        }
    </script>
    <style>
        /* Verhindert Scrollen während des Lockdowns */
        body.lockdown { overflow: hidden; }
        
        /* Minimalistisches Scrollbar-Design */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #1e1e24; }
        
        /* Harte Kanten, keine Standard-Fokus-Ringe */
        textarea:focus, button:focus { outline: none; }
    </style>
</head>
<body class="bg-charcoal-900 text-zinc-300 font-sans antialiased selection:bg-accent selection:text-charcoal-900 min-h-screen flex flex-col relative">

    <div id="lockdownOverlay" class="fixed inset-0 bg-black z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-1000">
        <div id="timerDisplay" class="text-6xl md:text-8xl font-mono text-zinc-500 tracking-tighter mb-6">20:00</div>
        <div class="text-zinc-600 tracking-widest text-sm uppercase font-light">Reizreduzierung aktiv. Keine Entscheidungen.</div>
    </div>

    <main id="dashboard" class="flex-1 w-full max-w-2xl mx-auto px-6 pt-12 md:pt-24 pb-12 flex flex-col transition-opacity duration-700">
        
        <header class="mb-12 border-b border-charcoal-700 pb-4">
            <h1 class="text-xs tracking-[0.3em] text-zinc-500 uppercase">Humaneed // Architektur</h1>
        </header>

        <section class="flex-1">
            <label for="stateInput" class="block text-xs uppercase tracking-wider text-zinc-500 mb-4">Systemzustand</label>
            <textarea 
                id="stateInput" 
                rows="4" 
                class="w-full bg-charcoal-800 text-zinc-200 border-l-2 border-charcoal-700 p-4 font-light text-lg resize-none transition-colors duration-300 focus:border-accent focus:bg-charcoal-700 placeholder-zinc-600"
                placeholder="Aktuelle kognitive Auslastung beschreiben... (z.B. Kopf voll, 10 Stunden gearbeitet, gestresst)"></textarea>
            
            <button 
                id="btnIntervention" 
                class="mt-6 w-full bg-charcoal-800 hover:bg-charcoal-700 text-zinc-300 text-xs tracking-[0.2em] uppercase py-4 border border-charcoal-700 hover:border-accent transition-all duration-300 flex justify-between items-center px-6">
                <span>[ Intervention Anfordern ]</span>
                <span class="text-accent opacity-0 transition-opacity duration-300" id="btnIndicator">///</span>
            </button>
        </section>

        <section id="outputSection" class="mt-12 hidden opacity-0 transition-opacity duration-700">
            <div class="border-t border-charcoal-700 pt-8">
                <h2 class="text-xs uppercase tracking-wider text-accent mb-4">Diagnostik-Terminal</h2>
                
                <div class="bg-[#050505] border border-charcoal-700 p-6 font-mono text-sm leading-relaxed">
                    <div id="terminalTyping" class="text-zinc-400"></div>
                </div>

                <button 
                    id="btnReset" 
                    class="mt-8 w-full bg-transparent text-zinc-500 hover:text-zinc-300 text-xs tracking-[0.2em] uppercase py-4 border border-charcoal-800 hover:border-charcoal-600 transition-colors duration-300">
                    [ System Reset ]
                </button>
            </div>
        </section>
    </main>

    <script>
        // DOM Elements
        const stateInput = document.getElementById('stateInput');
        const btnIntervention = document.getElementById('btnIntervention');
        const btnIndicator = document.getElementById('btnIndicator');
        const outputSection = document.getElementById('outputSection');
        const terminalTyping = document.getElementById('terminalTyping');
        const btnReset = document.getElementById('btnReset');
        const lockdownOverlay = document.getElementById('lockdownOverlay');
        const timerDisplay = document.getElementById('timerDisplay');
        const dashboard = document.getElementById('dashboard');

        // State
        let isTyping = false;
        let timerInterval;

        // Mock Logic Engine (Simuliert das LLM-JSON)
        function analyzeState(text) {
            const lowerText = text.toLowerCase();
            
            // Regelwerk basierend auf den 15 Mini-Setups
            if (lowerText.includes('stress') || lowerText.includes('kopf voll') || lowerText.includes('10 stunden')) {
                return {
                    diagnose: "Polyvagale Überlastung. Sympathikus dominiert. Autopilot aktiv.",
                    direktive: "SETUP 07 & 08",
                    titel: "Der physiologische Reset",
                    aktion: "Graustufen-Modus aktivieren. Eiskaltes Wasser über die Handgelenke. 20 Minuten Reizreduzierung. Keine Entscheidungen erzwingen."
                };
            } else if (lowerText.includes('müde') || lowerText.includes('schlafen') || lowerText.includes('abend')) {
                return {
                    diagnose: "Circadiane Desynchronisation. Vorbereitung für glymphatisches System erforderlich.",
                    direktive: "SETUP 09",
                    titel: "Low-Light-Abend",
                    aktion: "Alle Deckenlampen aus. Nur warme Lichtquellen. Melatonin-Synthese ermöglichen. Bildschirme abschalten."
                };
            } else if (lowerText.includes('unruhig') || lowerText.includes('fokus') || lowerText.includes('ablenkung')) {
                return {
                    diagnose: "Fragmentierte Aufmerksamkeit. Default Mode Network (DMN) überstimuliert.",
                    direktive: "SETUP 04 & 11",
                    titel: "Kognitive Integrität",
                    aktion: "1-Tab-Regel anwenden. 2 Minuten weiten Blick aus dem Fenster. Physischer Anker (Füße spüren)."
                };
            } else {
                return {
                    diagnose: "Strukturelle Diskrepanz detektiert. System benötigt Kalibrierung.",
                    direktive: "SETUP 01",
                    titel: "Der Schwellen-Puffer",
                    aktion: "Physischer Stop. Dreimal tief ausatmen. Aktuelle Umgebung gedanklich schließen, bevor die nächste Aktion beginnt."
                };
            }
        }

        // Terminal Schreib-Effekt
        async function typeText(textObj, element) {
            isTyping = true;
            element.innerHTML = '';
            
            const lines = [
                `<span class="text-zinc-600">> ANALYSE LÄUFT...</span><br><br>`,
                `<span class="text-zinc-300">DIAGNOSE:</span> <span class="text-zinc-400">${textObj.diagnose}</span><br><br>`,
                `<span class="text-accent">DIREKTIVE [${textObj.direktive}]:</span> <span class="text-zinc-200">${textObj.titel}</span><br>`,
                `<span class="text-zinc-400">${textObj.aktion}</span>`
            ];

            let htmlString = lines.join('');
            
            // Simulierter "Maschinen-Output" Delay
            element.innerHTML = '<span class="text-zinc-600 animate-pulse">_</span>';
            await new Promise(r => setTimeout(r, 600));
            
            element.innerHTML = htmlString;
            isTyping = false;
        }

        // Intervention Button Logic
        btnIntervention.addEventListener('click', async () => {
            if (isTyping) return;
            
            const inputText = stateInput.value.trim();
            if (!inputText) return; // Nichts tun bei leerem Input

            // UI Feedback
            btnIndicator.classList.remove('opacity-0');
            btnIntervention.classList.add('border-accent');
            
            // Sektion anzeigen
            outputSection.classList.remove('hidden');
            // Timeout für CSS Transition
            setTimeout(() => {
                outputSection.classList.remove('opacity-0');
            }, 50);

            // Diagnose holen und schreiben
            const diagnosis = analyzeState(inputText);
            await typeText(diagnosis, terminalTyping);
            
            btnIndicator.classList.add('opacity-0');
            btnIntervention.classList.remove('border-accent');
        });

        // 20-Minuten Timer Logic (Der Lockdown)
        function startLockdown() {
            // UI abriegeln
            document.body.classList.add('lockdown');
            lockdownOverlay.classList.remove('hidden');
            
            setTimeout(() => {
                lockdownOverlay.classList.remove('opacity-0');
                dashboard.classList.add('opacity-0', 'pointer-events-none');
            }, 50);

            let timeLeft = 20 * 60; // 20 Minuten in Sekunden
            
            // Display initial setzen
            updateTimerDisplay(timeLeft);

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                if (timeLeft <= 0) {
                    endLockdown();
                }
            }, 1000);
        }

        function updateTimerDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
        }

        function endLockdown() {
            clearInterval(timerInterval);
            document.body.classList.remove('lockdown');
            lockdownOverlay.classList.add('opacity-0');
            dashboard.classList.remove('opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                lockdownOverlay.classList.add('hidden');
                // Input zurücksetzen nach dem Reset
                stateInput.value = '';
                outputSection.classList.add('hidden', 'opacity-0');
            }, 1000);
        }

        // Event Listener für den Reset Button
        btnReset.addEventListener('click', startLockdown);

    </script>
</body>
</html>
